<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Patel Studio</title>
  <style>
    :root{
  --bg:#0f1724; --card:#0b1220; --muted:#94a3b8; --accent:#06b6d4; --panel:#0ea5e9;
  font-family: Inter, Arial, Helvetica, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#061021 0%, #071227 60%);color:#e6eef6}

/* Splash */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.logoImg{width:140px;height:140px;border-radius:18px;box-shadow:0 15px 40px rgba(2,6,23,0.5);transform:rotate(0);animation:logoSpin 6s infinite}
@keyframes logoSpin{0%{transform:rotate(0)}33%{transform:rotate(6deg)}66%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
.title{font-size:28px;margin:0}
.subtitle{color:var(--muted);margin:0}
.btn{display:inline-block;background:var(--panel);color:white;padding:10px 18px;border-radius:8px;text-decoration:none;border:none;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.08)}
/* Auth */
.authBody{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.authContainer{width:100%;max-width:980px;background:rgba(255,255,255,0.03);border-radius:12px;display:flex;overflow:hidden;box-shadow:0 20px 60px rgba(2,6,23,0.6)}
.leftPanel{flex:0 0 360px;padding:28px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.authLogo{width:96px;height:96px;border-radius:12px}
.muted{color:var(--muted);font-size:14px}
.roleChoice{display:flex;gap:10px;margin-top:12px}
.roleBtn{padding:10px 14px;border-radius:8px;border:none;background:var(--panel);color:white;cursor:pointer}
.roleBtn.outline{background:transparent;border:1px solid rgba(255,255,255,0.06)}
.info{color:var(--muted);font-size:13px;margin-top:6px}
.rightPanel{flex:1;padding:24px}
.authBox{background:transparent;padding:6px}
.hidden{display:none}
.authBox h3{margin:0 0 10px 0}
input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:inherit;margin:8px 0}
.row{display:flex;gap:12px;align-items:center;justify-content:flex-start;margin-top:8px}
.small{padding:6px 8px;border-radius:6px;border:none;cursor:pointer}
.switchRow{display:flex;gap:8px;margin-bottom:10px}
.small.active{background:var(--accent);color:#001}
.authBody .muted{color:#9fb2c4}
@media(max-width:880px){
  .authContainer{flex-direction:column}
  .leftPanel{flex:1;width:100%}
  .rightPanel{width:100%}
}

  </style>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="splash" class="splash">
    <div class="logoWrap">
      <img src="assets/logo.png" alt="Patel Studio" class="logoImg" />
    </div>
    <h1 class="title">Patel Studio</h1>
    <p class="subtitle">Design • Social • QR • Reels</p>
    <div class="splashActions">
      <a class="btn" href="login_select.html">Enter Studio</a>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
